[platformio]
default_envs = usb

[env]
lib_deps =
  knolleary/PubSubClient@^2.8.0
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:usb]
upload_protocol = esptool
upload_port = /dev/cu.usbmodem56910203721
monitor_port = ${env:usb.upload_port}
upload_speed = 115200
extra_scripts = post:scripts/upload_serial.py

[env:ota]
upload_protocol = espota
upload_port = afu-a1.local
upload_flags = --auth=${sysenv.AFU_OTA_PASSWORD}
