[platformio]
default_envs = usb

[env]
platform = espressif32@8.0.0
board = airm2m_core_esp32c3
framework = arduino
board_build.flash_mode = dio
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = pre:scripts/embed_web.py

[env:usb]
upload_protocol = esptool
upload_port = /dev/cu.usbmodem56910203721
monitor_port = ${env:usb.upload_port}
upload_speed = 115200
extra_scripts =
  ${env.extra_scripts}
  post:scripts/upload_serial.py

[env:ota]
upload_protocol = espota
upload_port = afu-a1.local
upload_flags = --auth=${sysenv.AFU_OTA_PASSWORD}
